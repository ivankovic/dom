name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Every test lives in a `#[cfg(test)]` module or `tests/`; the crate has no
      # doctests, so there is no `cargo test --doc` step to add.
      - run: cargo nextest run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Reporting only — never a merge gate. Two reasons: the 74.9% figure is
    # dominated by `main.rs`, whose event-loop wiring is not unit-testable, so a
    # threshold on it would measure the wrong thing; and the four on-disk
    # database tests have flaked once under instrumentation (see
    # .config/nextest.toml), which a runner with two cores and slower IO is more
    # likely to hit, not less.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      # Run once with `--no-report`, then render each format from the profile
      # data it leaves behind. No `--branch`: branch coverage needs a nightly
      # compiler, so the region percentages are the stable proxy for it.
      - run: cargo llvm-cov nextest --no-report
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
