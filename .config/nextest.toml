# nextest configuration.
#
# The suite is otherwise isolation-clean — every database test opens either
# `sqlite://:memory:` or its own `tempfile::tempdir()`, mock servers bind port 0,
# and nothing sets environment variables — so process-per-test needs no other
# help here.

[test-groups]
# The four tests below are the only ones that put a *real* SQLite database on
# the disk, WAL sidecars and all. Everything else is in memory. Run under
# coverage instrumentation they once all timed out together inside
# `db::init`, within 0.15s of each other, on sqlx's 30-second connection
# acquire timeout — the signature of the disk, not of a shared path.
#
# It reproduced repeatedly on 2026-09-11/12, on a developer machine at load
# average 8-16 with a live Dom writing an 80 MB WAL beside the repository:
# `PoolTimedOut` twice, and one run where a test that takes 0.1 s idle took 72
# seconds. The same suite passed in 3.4 s once the load dropped. So the shape is
# confirmed and it is the disk, not the code — these four are the only tests
# that touch one, and on a quiet machine they are unremarkable.
#
# This grouping is therefore still a declaration of a shared resource rather
# than a fix: it stops them contending with *each other*, which is all it can
# do. It cannot stop them contending with whatever else is using the disk, and
# on a loaded machine that is what actually bites. Note that `db::connect`'s
# pool waits up to 60 s for a connection (`MAX_POOL_WAIT`), deliberately, so a
# genuinely starved run here fails slowly rather than quickly.
on-disk-database = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
    test(=the_database_is_readable_only_by_its_owner)
  + test(=an_existing_world_readable_database_is_corrected_on_startup)
  + test(=every_pooled_connection_gets_the_relaxed_sync_setting)
  + test(=freed_pages_are_handed_back_rather_than_hoarded)
'''
test-group = "on-disk-database"
