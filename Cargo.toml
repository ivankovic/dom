[package]
name = "dom"
version = "0.1.0"
edition = "2024"
# The Anti-Capitalist Software License has no SPDX identifier, so point at the
# file rather than the `license` field, which only accepts valid SPDX expressions.
license-file = "LICENSE"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "net", "io-util", "signal"] }
anyhow = "1"

# Logging. Diagnostics go to a file, not the terminal — the TUI owns that,
# for its whole life. See src/logging.rs.
log = "0.4"
env_logger = "0.11"

# SQLite database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde", "clock"] }

# Random number generation
rand = "0.8"

# Local IP address detection
if-addrs = "0.10"

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# Network device discovery
surge-ping = "0.9.0"
futures = "0.3.32"

# TLS for the two public APIs in src/online/. Only a TLS transport is pulled in —
# the HTTP on top of it is hand-written, as it already is for LAN devices. "ring"
# rather than the default aws-lc-rs provider so the build needs no cmake/nasm.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Already in the tree as tokio-rustls's crypto provider; named directly for
# SHA-256, which is how a router's certificate is pinned. See src/devices/tls.rs.
ring = "0.17"

[dev-dependencies]
# Real directories for the tests that exercise file creation and permissions,
# named uniquely so concurrent runs of the suite cannot collide.
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
